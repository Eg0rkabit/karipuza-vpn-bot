name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/remnawave-v2
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Karipaza Froxy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Karipaza
        uses: actions/checkout@v4

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.13.14
          path: sing-box-core
          fetch-depth: 1
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache-dependency-path: sing-box-core/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build libbox
        working-directory: sing-box-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android

      - name: Copy libbox
        run: |
          mkdir -p android-app/app/libs
          cp sing-box-core/*.aar android-app/app/libs/
          test -f android-app/app/libs/libbox.aar

      - name: Build debug APK
        working-directory: android-app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Karipaza-Froxy-Android-arm64
          path: android-app/app/build/outputs/apk/other/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Karipaza-Froxy-Android-armv7
          path: android-app/app/build/outputs/apk/other/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
